version: "3.9"
# Deploy this file on each remote location device (Raspberry Pi / mini-PC)
# Run: docker compose -f docker-compose.agent.yml up -d

services:
  agent:
    build: ./agent
    container_name: family-security-agent
    restart: unless-stopped
    environment:
      - HUB_URL=${HUB_URL}
      - API_KEY=${API_KEY}
      - INTERFACE=${INTERFACE:-eth0}
      - SUBNET=${SUBNET:-192.168.1.0/24}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-60}
      - DNS_CAPTURE=${DNS_CAPTURE:-false}
    # Uncomment for DNS capture:
    # network_mode: host
    # cap_add:
    #   - NET_RAW
    #   - NET_ADMIN
